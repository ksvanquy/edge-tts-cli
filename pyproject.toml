[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-tts-cli"
version = "1.0.0"
description = "CLI for converting text to Edge TTS audio and subtitle formats"
requires-python = ">=3.10"
dependencies = ["edge-tts>=6.1.0"]

[project.optional-dependencies]
google = ["google-cloud-texttospeech>=2.16.0"]
whisper = ["faster-whisper>=1.0.0"]

[project.scripts]
tts = "tts_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
